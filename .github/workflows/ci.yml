name: validacion pagina

on: 
  push:
    branches: [santiago]
  pull_request:
    branches: [santiago]

jobs:
  validacion:
    name: crear maquina virtual
    runs-on: ubuntu-latest

    steps:
      - name: clonar repositorio
        uses: actions/checkout@v4

      - name: instalar node
        uses: actions/setup-node@v4
        with:
          node-version: '22'