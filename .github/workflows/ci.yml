name: validacion pagina

on: 
  push:
    branches: [santiago,main]
  pull_request:
    branches: [santiago,main]


jobs:
    validacion:
        name: crear una maquina virtual
        runs-on: ubuntu-latest

        steps:
            - name: checkout repositorio
              uses: actions/checkout@v4
            
            - name: instalar node
              uses: actions/setup-node@v4
              with:
                node-version: 24
            - name: validar codigo html
              run: |
                echo "inicio"
                npx html-validate "**/*.html"
                echo "fin"